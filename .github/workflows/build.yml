name: Build Dopamine (Rootless) & Relaxin (RootHide) Packages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        jailbreak_scheme: [rootless, roothide]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Theos & Dependencies
      run: |
        brew install ldid xz dpkg
        if [ "${{ matrix.jailbreak_scheme }}" = "roothide" ]; then
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
        else
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
        fi
        curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1

    - name: Build Tweak Package (${{ matrix.jailbreak_scheme }})
      env:
        THEOS: ${{ runner.os == 'macOS' && format('{0}/theos', env.HOME) || '' }}
      run: |
        export THEOS=$HOME/theos
        chmod 755 layout/DEBIAN/postinst
        if [ "${{ matrix.jailbreak_scheme }}" = "roothide" ]; then
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e || make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64e
        else
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e"
        fi

    - name: Upload Deb Artifact (${{ matrix.jailbreak_scheme }})
      uses: actions/upload-artifact@v4
      with:
        name: AngelGuardian-${{ matrix.jailbreak_scheme }}-deb
        path: packages/*.deb
